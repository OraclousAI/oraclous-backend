[project]
name = "oraclous-citation"
version = "0.0.0"
description = "Shared citation contract fixture + the Citation/SourceRef models and the deterministic citation_id (shared)."
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oraclous_citation"]
