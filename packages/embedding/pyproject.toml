[project]
name = "oraclous-embedding"
version = "0.0.0"
description = "The shared embedder seam (#643 / #949) — Embedder protocol, HashingEmbedder, OpenAIEmbedder, make_embedder and embedder_identity — so knowledge-graph-service (write) and knowledge-retriever-service (read) can never spell the same embedder two different ways."
requires-python = "==3.12.*"
dependencies = [
    "openai>=1.40,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oraclous_embedding"]
