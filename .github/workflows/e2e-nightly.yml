### Every deployed-stack e2e leg — nightly, never on a pull request (#1012, #1144).
#
# Two jobs, once a night off-peak, plus workflow_dispatch for an on-demand run:
#   - `byom-full`: the full real-model leg, ~60 real team runs of several model rounds each.
#   - `e2e`: the deterministic leg (fake harness) and the OAuth leg, moved here from ci.yml (#1144)
#     so a pull request no longer pays for a full stack build.
# They block nothing; when one fails, the job is simply red. Before opening a PR, run the suite
# locally (`scripts/e2e.sh --up`) as CLAUDE.md §9 asks.
#
# Failure triage: a red nightly is either a real regression in the real-model path or an environment
# one (a spent provider key, a free-model rate limit — OpenRouter caps free models at ~1000
# requests/day per key, and one full pass is a large fraction of that). Read the step log before
# filing; tests/e2e/README.md says which key each test brings.
name: Nightly full real-model e2e

on:
  schedule:
    # 03:17 UTC — off-peak, and deliberately off the top of the hour (scheduled runs queue behind
    # everyone else's `0 * * * *`). Scheduled runs only ever use the default branch.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  # never let two full legs share one OpenRouter key; a running pass finishes rather than being cut
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  byom-full:
    name: "Full BYOM real-LLM e2e through the gateway (no fakes; rules 3-5)"
    # forks inherit the schedule but not the secret, where every run would be a pointless skip
    if: github.repository == 'OraclousAI/oraclous-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 330  # generous on purpose: ~60 real team runs; the hosted-runner ceiling is 360
    env:
      # the whole point of this workflow: a REAL model, never the fake harness (rule 8)
      HARNESS_LLM_MODE: live
      # The application services sit behind `profiles: [services]`; without this, `up` brings up ONLY
      # the infra (postgres/redis/neo4j) and the gateway never starts.
      COMPOSE_PROFILES: services
      # Edge-auth (ADR-018), as deploy/.env sets for a real deployment: the gateway VALIDATES the user
      # JWT and downstream services TRUST the forwarded X-Principal. The compose default is `dev` (only
      # the fixed dev-token), which rejects the real JWTs the e2e registers — so wire the real chain.
      GATEWAY_AUTH_MODE: jwt
      ENGINE_AUTH_MODE: gateway
      HARNESS_AUTH_MODE: gateway
      KGS_AUTH_MODE: gateway
      KRS_AUTH_MODE: gateway
      CRED_BROKER_AUTH_MODE: gateway
      CAPABILITY_REGISTRY_AUTH_MODE: gateway
      CAPABILITY_REGISTRY_BROKER_MODE: real
      # This stack is single-tenant and disposable; IMDS/link-local stay blocked in either mode.
      CAPABILITY_REGISTRY_ALLOW_PRIVATE_EGRESS: "true"
      # Keep this compose invocation identical to the `e2e` job's below — the two stacks must not
      # drift, or one leg's red means nothing to the other. The e2e overlay exempts the runner
      # from the edge limiter (#850); this leg registers an organisation per test, which is exactly
      # what trips it.
      COMPOSE: "docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev-ports.yml -f deploy/docker-compose.e2e.yml"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - name: Build + start the deployed stack (live harness)
        run: $COMPOSE up -d --build --wait
      - name: Wait for the gateway (a skip is NOT a pass — fail if it never comes up)
        run: |
          for _ in $(seq 1 60); do curl -fsS localhost:8006/health >/dev/null 2>&1 && exit 0; sleep 2; done
          echo "::error::gateway :8006 never became healthy"; exit 1
      - name: Confirm the harness really is live (the stale-environment trap)
        run: |
          mode=$($COMPOSE exec -T harness-runtime-service printenv HARNESS_LLM_MODE 2>/dev/null | tr -d '\r' || true)
          echo "harness HARNESS_LLM_MODE=${mode:-<unreadable>}"
          if [ "$mode" = "fake" ]; then
            echo "::error::the harness is in fake mode — a fake-LLM run is never a real-model proof (rule 8)"; exit 1
          elif [ -z "$mode" ]; then
            echo "::warning::could not read the harness mode from the container; the compose default is live"
          fi
      - name: Full BYOM real-LLM e2e (only when the model-key secret is set)
        timeout-minutes: 300  # a hang is a bounded failure, never a silent job cancellation
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # #1000: the ONE model every e2e binds. Optional repo variable; the fallback is the SAME
          # default as tests/e2e/conftest.py so the two never drift. Free on OpenRouter.
          E2E_MODEL: ${{ vars.E2E_MODEL || 'openrouter/nvidia/nemotron-3-super-120b-a12b:free' }}
        # the SAME selection scripts/e2e.sh --byom runs: the full leg, not the PR subset
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY secret not set — skipping the BYOM real-LLM leg"; exit 0
          fi
          uv run pytest tests/e2e -m byom -v -p no:cacheprovider
      - name: Stack logs on failure
        if: failure()
        run: $COMPOSE logs --tail 200
      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  # #1144: the deterministic + OAuth legs, moved here from ci.yml (they no longer run on a pull
  # request). Builds + brings up the REAL stack and drives every user journey THROUGH THE GATEWAY — no
  # fakes, no mocks, no DB-direct. Keyless: the fake harness (deterministic LLM) + the hashing
  # embedder. The real-model coverage is the `byom-full` job above (a superset of the old PR subset).
  e2e:
    name: "Deployed-stack e2e through the gateway (no fakes; rules 3-5)"
    if: github.repository == 'OraclousAI/oraclous-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # building ~14 service images from scratch + the full stack is the long pole
    env:
      HARNESS_LLM_MODE: fake
      # The application services sit behind `profiles: [services]`; without this, `up` brings up ONLY
      # the infra (postgres/redis/neo4j) and the gateway never starts.
      COMPOSE_PROFILES: services
      # Edge-auth (ADR-018), as deploy/.env sets for a real deployment: the gateway VALIDATES the user
      # JWT and downstream services TRUST the forwarded X-Principal. The compose default is `dev` (only
      # the fixed dev-token), which rejects the real JWTs the e2e registers — so wire the real chain.
      GATEWAY_AUTH_MODE: jwt
      ENGINE_AUTH_MODE: gateway
      HARNESS_AUTH_MODE: gateway
      KGS_AUTH_MODE: gateway
      KRS_AUTH_MODE: gateway
      CRED_BROKER_AUTH_MODE: gateway
      CAPABILITY_REGISTRY_AUTH_MODE: gateway
      CAPABILITY_REGISTRY_BROKER_MODE: real
      # #515 deliver-back: the github-sink reaches the same-stack gitea forge at gitea:3000 (a
      # single-label private host the SSRF gate rejects by default). Relax egress for THIS test stack
      # only (single-tenant; default-OFF in prod; IMDS/link-local stay blocked in either mode). The
      # forge admin/token is minted by the "Arm the gitea deliver-back forge" step below.
      CAPABILITY_REGISTRY_ALLOW_PRIVATE_EGRESS: "true"
      # #850: the e2e overlay exempts the runner's own connections from the edge limiter (the suite
      # registers an org per test and the per-IP window is smaller than that). E2E stack only.
      COMPOSE: "docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev-ports.yml -f deploy/docker-compose.e2e.yml"
      COMPOSE_OAUTH: "docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev-ports.yml -f deploy/docker-compose.e2e.yml -f deploy/docker-compose.e2e-oauth.yml"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.7"
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - name: Build + start the deployed stack (keyless)
        run: $COMPOSE up -d --build --wait
      - name: Wait for the gateway (a skip is NOT a pass — fail if it never comes up)
        run: |
          for _ in $(seq 1 60); do curl -fsS localhost:8006/health >/dev/null 2>&1 && exit 0; sleep 2; done
          echo "::error::gateway :8006 never became healthy"; exit 1
      # #515: mint the gitea admin/token + export GITEA_* so the deliver-back e2e RUNS (not skips on
      # requires_gitea). Same shared script scripts/e2e.sh calls (no drift). Fails loud if the
      # already-healthy gitea cannot be set up — a skip would not count as the O7 proof (rule 3).
      - name: Arm the gitea deliver-back forge (#515 — mint admin/token so the O7 e2e RUNS)
        run: scripts/setup-gitea-e2e.sh >> "$GITHUB_ENV"
      - name: Deterministic e2e through the gateway
        # `github` is DESELECTED here (like byom): the real-github.com O7 keyed proof (#542) is
        # human-gated — run locally via `scripts/e2e.sh --github` with deploy/.env creds + Reza
        # sign-off (CI has no real write PAT). The gitea forge is its deterministic CI counterpart.
        run: uv run pytest tests/e2e -m "e2e and not byom and not oauth and not github" -v -p no:cacheprovider
      - name: OAuth login e2e (a real local dex provider)
        run: |
          $COMPOSE_OAUTH up -d --wait dex
          $COMPOSE_OAUTH up -d --force-recreate --no-deps auth-service
          for _ in $(seq 1 30); do curl -fsS localhost:8006/oauth/providers 2>/dev/null | grep -q '"dex"' && break; sleep 1; done
          uv run pytest tests/e2e -m oauth -v -p no:cacheprovider
      - name: Stack logs on failure
        if: failure()
        run: $COMPOSE_OAUTH logs --tail 200
      - name: Tear down
        if: always()
        run: $COMPOSE_OAUTH down -v
